spring:
  application:
    name: finstream-rag-audit

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/finstream
          jwk-set-uri: http://localhost:8081/realms/finstream/protocol/openid-connect/certs

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/finstream
    username: finstream
    password: finstream

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: finstream-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

finstream:
  fraud:
    amount-threshold: 10000
    velocity-limit: 10
    velocity-window: PT1H
    rag-max-results: 5
    history-limit: 20
    weights:
      rule-gate: 0.20
      rag: 0.30
      llm: 0.50
    thresholds:
      approve-max: 30
      flag-max: 70

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
